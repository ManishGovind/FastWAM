# RoboTwin 2.0 CLEAN demos (2,500 episodes, data/robotwin2.0_clean) with RGB + precomputed
# depth / flow (scripts/precompute_depth_flow.py, keys observation.images.cam_*_{depth,flow}) as
# three separate 3-camera videos, each in the robotwin tile [384, 320] (120 tokens / latent frame).
# Same data / normalization / text cache as robotwin.yaml + the clean RGB baseline
# (robotwin_joint_3cam_384_1e-4_clean). Needs depth/flow extracted for the clean subset.
train:
  _target_: fastwam.datasets.lerobot.robot_multimodal_video_dataset.RobotMultimodalVideoDataset
  dataset_dirs:
    - ./data/robotwin2.0_clean/robotwin2.0_clean
  shape_meta:
    images:
      # Order must match modality_camera_groups indices below.
      - {key: cam_high, raw_shape: [3, 480, 640], shape: [3, 240, 320]}
      - {key: cam_left_wrist, raw_shape: [3, 480, 640], shape: [3, 240, 320]}
      - {key: cam_right_wrist, raw_shape: [3, 480, 640], shape: [3, 240, 320]}
      - {key: cam_high_depth, raw_shape: [3, 480, 640], shape: [3, 240, 320]}
      - {key: cam_left_wrist_depth, raw_shape: [3, 480, 640], shape: [3, 240, 320]}
      - {key: cam_right_wrist_depth, raw_shape: [3, 480, 640], shape: [3, 240, 320]}
      - {key: cam_high_flow, raw_shape: [3, 480, 640], shape: [3, 240, 320]}
      - {key: cam_left_wrist_flow, raw_shape: [3, 480, 640], shape: [3, 240, 320]}
      - {key: cam_right_wrist_flow, raw_shape: [3, 480, 640], shape: [3, 240, 320]}
    action:
      - {key: default, raw_shape: 14, shape: 14}
    state:
      - {key: default, raw_shape: 14, shape: 14}
  # pixel_values camera indices -> separate [C, T, 384, 320] videos (head, left wrist, right wrist)
  modality_camera_groups:
    rgb: [0, 1, 2]
    depth: [3, 4, 5]
    flow: [6, 7, 8]
  # Unimodal future_key parity: each aux stream is [RGB_t0, modality_t>=1]
  rgb_condition_modalities: [depth, flow]
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 action, 9 video frames
  video_size: [384, 320] # robotwin 3-cam tile
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: true
  pretrained_norm_stats: ./data/robotwin2.0/dataset_stats.json
  skip_padding_as_possible: false
  concat_multi_camera: "robotwin"
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 9
    action_output_dim: 14
    proprio_output_dim: 14
    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: "z-score"
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
  text_embedding_cache_dir: ./data/text_embeds_cache/robotwin
  context_len: 128

