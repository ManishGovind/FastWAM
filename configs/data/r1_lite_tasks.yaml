# Galaxea R1-Lite real-world LeRobot v2.1 dataset (stack the bowl).
train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - /net/labs/sdas24_lab/Real-World-Data-R1-Lite/galaxea_stack_bowl_rightarm_debug_fastwam
  shape_meta:
    images:
      - key: image
        raw_shape: [3, 640, 640]
        shape: [3, 240, 320]
      - key: wrist_left_image
        raw_shape: [3, 360, 640]
        shape: [3, 240, 320]
      - key: wrist_right_image
        raw_shape: [3, 360, 640]
        shape: [3, 240, 320]
    action:
      - key: default
        raw_shape: 14 # left arm 6 + right arm 6 + left gripper + right gripper
        shape: 14
    state:
      - key: default
        raw_shape: 14
        shape: 14
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 action, 9 video frames
  video_size: [384, 320] # robotwin 3-cam layout
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  skip_padding_as_possible: false
  concat_multi_camera: "robotwin"
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 3
    action_output_dim: 14
    proprio_output_dim: 14
    # joints look like deltas; grippers are absolute 0/100
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, true, true, true, true, true, true, false, false]

    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: "z-score"
    norm_exception_mode: null

    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
  text_embedding_cache_dir: ./data/text_embeds_cache/r1_lite_tasks
  context_len: 128
