# Standalone inference config for the stack-bowls v5 absolute-arm R1-Lite model.
# This preserves the resolved training contract while replacing cluster-only
# paths with workstation-local inference assets.
defaults:
  - data: r1lite_stack_bowls_v5_absarm
  - model: fastwam_joint
  - _self_

output_dir: ./runs/stack_bowls_v5_absarm
eval_num_inference_steps: 10
mixed_precision: bf16
seed: 42

data:
  train:
    pretrained_norm_stats: ./runs/stack_bowls_v5_absarm/dataset_stats.json
    text_embedding_cache_dir: ./data/text_embeds_cache/stack_bowls/r1lite_stack_bowls_v5_absarm

model:
  redirect_common_files: false
  mot_checkpoint_mixed_attn: false
  action_scheduler:
    train_shift: 5.0
    infer_shift: 5.0

EVALUATION:
  action_horizon: 32
  num_inference_steps: 10
  action_semantics: absolute
