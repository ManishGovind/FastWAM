# @package _global_

defaults:
  - override /data: libero_2cam_rgb_depth_flow
  - override /model: fastwam_joint_multimodal_select
  - _self_

# Multistream is ~3x video tokens vs unimodal; keep effective batch ≈ 32 via accum.
batch_size: 16
num_workers: 8
gradient_accumulation_steps: 2

model:
  mot_checkpoint_mixed_attn: false
  modality_select: random

# Multistream MoT at infer (training-matched); fixed RGB future for GT/random comparison.
EVALUATION:
  compile_action_infer: false
  active_future: rgb

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 10000

# training
weight_decay: 1e-2
resume: null
