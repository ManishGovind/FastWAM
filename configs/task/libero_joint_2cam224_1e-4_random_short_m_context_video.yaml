# @package _global_
# Control for libero_joint_2cam224_1e-4_router_short_m_context_video: same model and
# modality condition, but RANDOM stream selection instead of the learned router.
#   video expert context  = T5("<instruction> Predict the <modality> video.") + proprio   (joint)
#   action expert context = T5("<instruction>") + proprio                                (target = video)
#   sequence = [R0 | chosen future | A]; the chosen stream is uniform random per sample.
# Needs: python scripts/precompute_modality_text_embeds.py task=libero_joint_2cam224_1e-4_random_short_m_context_video

defaults:
  - override /data: libero_2cam_rgb_depth_flow
  - override /model: fastwam_joint_multimodal_select_new
  - _self_

batch_size: 16
num_workers: 8
gradient_accumulation_steps: 2

model:
  mot_checkpoint_mixed_attn: false
  enabled_video_streams: [rgb, depth, flow]
  # Random selection (no learned router): each sample's future stream is drawn uniformly.
  modality_select: random
  router_layout: short
  modality_prompt: true
  modality_prompt_mode: joint
  modality_prompt_target: video

EVALUATION:
  compile_action_infer: false
  # The stream is chosen at eval time; pass --active-future rgb|depth|flow (one eval each).
  # The model then gets the matching condition ("... Predict the <stream> video.").
  active_future: random

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 10000
weight_decay: 1e-2
resume: null
