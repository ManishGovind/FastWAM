# @package _global_

defaults:
  - override /data: xhand1_tasks
  - override /model: fastwam_joint
  - _self_

# dataloading
batch_size: 16
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 50 # ~187k train samples per epoch (3 tasks)
max_steps: 30000
log_every: 10
save_every: 5000
eval_every: 5000

# training
gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null
