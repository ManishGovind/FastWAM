# @package _global_
# RGB-only student (= the RGB baseline libero_joint_2cam224_1e-4, from scratch) distilled from the
# frozen privileged MM teacher (libero_joint_2cam224_1e-4_rgb_depth_flow_streamemb_tok_priv).
#   student : [R0 | R_fut | A]           teacher : [R0 | R_fut | D0 | D_fut | F0 | F_fut | A]
#   teacher sees the student's noisy RGB latents / noisy action / t_v / t_a, depth & flow noised at t_v,
#   real D0 / F0 from the data.
#   loss    : RGB video loss (GT) + w(t_a) * || v_student - v_teacher ||^2   (no GT action loss)
# Eval: plain FastWAMJoint (the teacher is never loaded at eval).
# Launch with:  model.teacher_run=runs/libero_joint_2cam224_1e-4_rgb_depth_flow_streamemb_tok_priv/<date>
# Model code: src/fastwam/models/wan22/fastwam_joint_distill.py

defaults:
  - override /data: libero_2cam_rgb_depth_flow
  - override /model: fastwam_joint
  - _self_

data:
  train:
    rgb_condition_modalities: []   # teacher needs the real D0 / F0

# as the RGB baseline (32 x 1); use 16 x 2 if the extra teacher forward OOMs
batch_size: 32
num_workers: 8
gradient_accumulation_steps: 1

model:
  _target_: fastwam.runtime_distill.create_fastwam_joint_distill
  mot_checkpoint_mixed_attn: false
  teacher_run: ???
  teacher_step: 21700

EVALUATION:
  compile_action_infer: false

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 7000
eval_every: 10000
weight_decay: 1e-2
resume: null
