# @package _global_
# Control: MM + stream embedding (per-stream identity), NO cross-modal attention (= MM mask).
# Pair with ..._rgb_depth_flow_crosscascade_streamemb to isolate the cascade.
#   sequence = [R0 | R_fut | D_fut | F_fut | A]
#   video    : each future attends R0 + its own future (as MM)
#   action   : reads all futures (as MM); video never attends the action

defaults:
  - override /data: libero_2cam_rgb_depth_flow
  - override /model: fastwam_joint_multimodal
  - _self_

batch_size: 8
num_workers: 8
gradient_accumulation_steps: 4

model:
  mot_checkpoint_mixed_attn: false
  cross_stream_attention: none
  stream_embedding: true

EVALUATION:
  compile_action_infer: false
  action_attend_mode: all

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 10000
weight_decay: 1e-2
resume: null
