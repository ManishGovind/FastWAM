# @package _global_
# = robotwin_joint_3cam_384_1e-4_clean_router_full_all_streamemb_embed_cf (COUNTERFACTUAL router reward:
# 3 action copies per sample, copy m reads R0 + X_f^m; WAM action loss = mean over copies)
# with the TOKEN stream embedding (as on LIBERO, libero_joint_2cam224_1e-4_router_full_all_streamemb_tok_embed_cf_ahist)
# + the past 32 executed actions as a router input (a_{t-32} .. a_{t-1}, normalized, pad rows zeroed + is_pad flags).
# Differences to the cf base config: stream_embedding_mode: token, data.train.action_history_steps,
# model.router_action_history.
# NOTE: the RoboTwin eval policy (experiments/robotwin/fastwam_policy) does not pass the history yet;
# without it the router sees an all-pad history on every chunk.

defaults:
  - override /data: robotwin_clean_rgb_depth_flow
  - override /model: fastwam_joint_multimodal_select_new
  - _self_

data:
  train:
    action_history_steps: 32   # a_{t-32} .. a_{t-1} (action stride 1)

batch_size: 8
num_workers: 8
gradient_accumulation_steps: 4   # global 8 x 4 x 8 GPUs = 256 (4 GPUs: accum 8)

model:
  mot_checkpoint_mixed_attn: false
  enabled_video_streams: [rgb, depth, flow]
  modality_select: router
  stream_router_temperature: 1.0
  router_entropy_coef: 0.01
  router_collapse_kl: 0.1
  router_warmup_steps: 2000
  router_reward: counterfactual   # every sample: one action copy per stream; router minimizes the expected relative action loss
  router_baseline: timestep_ema
  router_adv_normalize: true
  router_video_size: ${data.train.video_size}
  router_layout: full
  router_video_loss: all
  modality_prompt: false
  stream_embedding: true      # per-stream identity, init randn*0.02
  stream_embedding_mode: token   # added once to the patch-embedded future tokens (adaLN untouched)
  router_input: embed         # router reads the video expert's patch/text embeddings (detached)
  router_action_history: true # + past data.train.action_history_steps actions (MLP of the flattened actions + pad flags)

EVALUATION:
  compile_action_infer: false
  # No active_future: the router picks the stream at every replan.

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 10000
weight_decay: 1e-2
resume: null
