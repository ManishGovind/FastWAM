# @package _global_
# Full layout, video loss on ALL futures, action reads ONE (random) future. No modality prompt.
#   sequence = [R0 | R_fut | D_fut | F_fut | A]           (MM layout, 718 tokens)
#   video     : all three futures denoised + trained every sample (= MM's video supervision)
#   action    : sees R0 + ONE future, chosen uniformly per sample (one-hot gate on the action rows)
#   context   : plain [instruction | proprio] for both experts (like MM; one context per sample
#               cannot condition three slots, so no "Predict the X video." sentence)
# Question it answers: does MM's gain come from the extra video supervision (-> ~MM) or from the
# action reading several futures (-> ~single-stream models)?

defaults:
  - override /data: libero_2cam_rgb_depth_flow
  - override /model: fastwam_joint_multimodal_select_new
  - _self_

batch_size: 8
num_workers: 8
gradient_accumulation_steps: 4

model:
  mot_checkpoint_mixed_attn: false
  enabled_video_streams: [rgb, depth, flow]
  modality_select: random
  router_layout: full
  router_video_loss: all
  modality_prompt: false

EVALUATION:
  compile_action_infer: false
  # Stream the action reads at eval (one-hot gate, same as training):
  #   random -> uniform per replan; or pass --active-future rgb|depth|flow for a fixed stream.
  active_future: random

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 10000
weight_decay: 1e-2
resume: null
