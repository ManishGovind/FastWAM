# @package _global_
# R1-Lite counterpart of libero_joint_2cam224_1e-4_random_full_all.
# Full layout, video loss on ALL futures, action reads ONE (random) future. No modality prompt.
#   sequence  = [R0 | R_fut | D_fut | F_fut | A]   (120 tokens / latent frame: 120 + 3*2*120 + 32 = 872)
#   video     : all three futures denoised + trained every sample
#   action    : sees R0 + ONE future, chosen uniformly per sample (one-hot gate on the action rows)
#   context   : plain [instruction | proprio]

defaults:
  - override /data: r1_lite_rgb_depth_flow
  - override /model: fastwam_joint_multimodal_select_new
  - _self_

batch_size: 8
num_workers: 8
gradient_accumulation_steps: 4

model:
  mot_checkpoint_mixed_attn: false
  enabled_video_streams: [rgb, depth, flow]
  modality_select: random
  router_layout: full
  router_video_loss: all
  modality_prompt: false

EVALUATION:
  compile_action_infer: false
  # random -> uniform per replan; or pass active_future rgb|depth|flow for a fixed stream.
  active_future: random

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 2000
weight_decay: 1e-2
resume: null
