# @package _global_
# One-pass modality selection (full MoT + per-sample masks).
# Compare to libero_joint_2cam224_1e-4_rgb_depth_flow_random_future_modality_selection
# which uses up to 3 short MoT group forwards.

defaults:
  - override /data: libero_2cam_rgb_depth_flow
  - override /model: fastwam_joint_multimodal_select_onepass
  - _self_

batch_size: 16
num_workers: 8
gradient_accumulation_steps: 2

model:
  mot_checkpoint_mixed_attn: false
  modality_select: random

EVALUATION:
  compile_action_infer: false
  active_future: rgb

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 10000

weight_decay: 1e-2
resume: null
