# @package _global_
# Oracle modality selection from offline action-error GT labels (no learned router).
# Labels: notebooks/modality_action_labels.py --analyze → labels_*.pt

defaults:
  - override /data: libero_2cam_rgb_depth_flow
  - override /model: fastwam_joint_multimodal_select
  - _self_

batch_size: 16
num_workers: 8
gradient_accumulation_steps: 2

data:
  train:
    # Offline oracle from modality_action_labels.py --analyze --frame-stride 1
    modality_label_path: notebooks/outputs/modality_action_labels/labels_epall_stride1_s42-43-44_grip0.2148.pt
    modality_label_frame_stride: 1
    modality_label_nearest: true

model:
  mot_checkpoint_mixed_attn: false
  enabled_video_streams: [rgb, depth, flow]
  modality_select: gt

# Eval: same MoT layout as training when the chosen stream is RGB ([R0|R_fut|A]).
# Prefer active_future over action_attend_mode alone (attend-only still keeps all futures).
EVALUATION:
  compile_action_infer: false
  active_future: rgb

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 10000
weight_decay: 1e-2
resume: null
