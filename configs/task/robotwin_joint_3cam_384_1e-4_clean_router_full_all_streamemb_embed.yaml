# @package _global_
# RoboTwin CLEAN, SR-MoT (router) + stream embedding + embed router input: identical to
# robotwin_joint_3cam_384_1e-4_clean_random_full_all except the learned router picks the future the
# action reads. Router warm-up 2000 of ~21,300 steps (~9%, as on LIBERO).

defaults:
  - override /data: robotwin_clean_rgb_depth_flow
  - override /model: fastwam_joint_multimodal_select_new
  - _self_

batch_size: 8
num_workers: 8
gradient_accumulation_steps: 4   # global 8 x 4 x 8 GPUs = 256 (4 GPUs: accum 8)

model:
  mot_checkpoint_mixed_attn: false
  enabled_video_streams: [rgb, depth, flow]
  modality_select: router
  stream_router_temperature: 1.0
  router_entropy_coef: 0.01
  router_collapse_kl: 0.1
  router_warmup_steps: 2000
  router_reward: action
  router_baseline: timestep_ema
  router_adv_normalize: true
  router_video_size: ${data.train.video_size}
  router_layout: full
  router_video_loss: all
  modality_prompt: false
  stream_embedding: true      # per-stream identity (adaLN), init randn*0.02
  router_input: embed         # router reads the video expert's patch/text embeddings (detached)

EVALUATION:
  compile_action_infer: false
  # No active_future: the router picks the stream at every replan.

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500
weight_decay: 1e-2
resume: null
