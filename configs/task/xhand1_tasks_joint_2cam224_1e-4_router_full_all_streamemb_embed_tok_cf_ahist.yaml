# @package _global_
# xhand1 counterpart of r1_lite_joint_3cam_384_1e-4_router_full_all_streamemb_embed_tok_cf_ahist,
# on the 2-cam (ego | wrist, 224x448) layout and schedule of xhand1_tasks_joint_2cam224_1e-4.
# Learned router picks the future the action reads, per-stream identity (stream_embedding, token
# mode), router on the video expert's patch/text embeddings (router_input: embed) plus the past
# 32 actions, counterfactual router reward.

defaults:
  - override /data: xhand1_tasks_2cam_rgb_depth_flow
  - override /model: fastwam_joint_multimodal_select_new
  - _self_

data:
  train:
    action_history_steps: 32   # a_{t-32} .. a_{t-1} (action stride 1)

batch_size: 16   # 3 video streams; libero_2cam_rgb_depth_flow runs 8 at the same 224x448
num_workers: 8
gradient_accumulation_steps: 4

model:
  mot_checkpoint_mixed_attn: false
  enabled_video_streams: [rgb, depth, flow]
  modality_select: router
  stream_router_temperature: 1.0
  router_entropy_coef: 0.01
  router_collapse_kl: 0.1
  router_warmup_steps: 2700   # ~9% of 30000 steps, same fraction as LIBERO (2000 / 21700)
  router_reward: counterfactual
  router_baseline: timestep_ema
  router_adv_normalize: true
  router_video_size: ${data.train.video_size}
  router_layout: full
  router_video_loss: all
  modality_prompt: false
  stream_embedding: true      # per-stream identity (adaLN), init randn*0.02
  stream_embedding_mode: token
  router_input: embed         # router reads the video expert's patch/text embeddings (detached)
  router_action_history: true
  router_action_history_steps: ${data.train.action_history_steps}

EVALUATION:
  compile_action_infer: false
  # No active_future: the router picks the stream at every replan.

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 50
max_steps: 30000
log_every: 10
save_every: 5000
eval_every: 5000

# training
weight_decay: 1e-2
resume: null
