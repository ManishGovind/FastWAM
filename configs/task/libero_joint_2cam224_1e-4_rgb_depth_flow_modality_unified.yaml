# @package _global_
# Stage 1: joint MoT attention (single RGB future) + multimodal video losses
# on that same prediction (RGB / depth / flow targets, shared noise).

defaults:
  - override /data: libero_2cam_rgb_depth_flow
  - override /model: fastwam_joint_multimodal_unified
  - _self_

# Same token count as RGB-only joint (not 3x multimodal).
batch_size: 16
num_workers: 8
gradient_accumulation_steps: 2

model:
  mot_checkpoint_mixed_attn: false
  enabled_video_streams: [rgb, depth, flow]
  loss:
    lambda_rgb: 1.0
    lambda_depth: 1.0
    lambda_flow: 1.0
    lambda_action: 1.0


# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 10000

# training
weight_decay: 1e-2
resume: null
