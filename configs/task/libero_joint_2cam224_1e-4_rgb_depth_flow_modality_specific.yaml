# @package _global_

defaults:
  - override /data: libero_2cam_rgb_depth_flow
  - override /model: fastwam_joint_multimodal
  - _self_

# Multistream is ~3x video tokens vs unimodal; keep effective batch ≈ 32 via accum.
batch_size: 32
num_workers: 8
gradient_accumulation_steps: 1

model:
  mot_checkpoint_mixed_attn: false

# Multistream MoT at infer (training-matched); do not use video-cache compile path.
EVALUATION:
  compile_action_infer: false
  # Infer ablation for FastWAMJointMultimodal only:
  # all | rgb | depth | flow | rgb_depth | rgb_flow | depth_flow | cond_only
  action_attend_mode: all

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 10000

# training
weight_decay: 1e-2
resume: null
