# @package _global_
# Privileged feature KD (ablation (e)): RGB-only student distilled from the PRIVILEGED MM teacher, which takes
# all modalities as input (real R0, D0, F0) and predicts all three futures.
#   teacher : [R0 | R_fut | D0 | D_fut | F0 | F_fut | A]   (libero_joint_2cam224_1e-4_rgb_depth_flow_streamemb_tok_priv)
#   student : [R0 | R_fut | A]                               (= the RGB baseline libero_joint_2cam224_1e-4, from scratch)
#   teacher sees the student's noisy RGB latents / noisy action / t_v / t_a; depth & flow futures noised at t_v,
#   real clean D0 / F0 from the data (rgb_condition_modalities: []).
#   loss    : [RGB video loss (GT) + RGB action loss (GT)]  (= the RGB baseline's total)
#             + 1.0 * KD,  KD = w(t_a) * ||LN(h_S) - LN(h_T)||^2   (separate term)
#             h = last-layer action hidden state (input of the linear action head)
# Same loss as distill_mm_tok_feat; only the teacher (and its D0/F0 input) differ.
# Inference cost = RGB baseline = ours short (326 tokens / call). Eval: plain FastWAMJoint (teacher never loaded).
# Launch with:  model.teacher_run=runs/libero_joint_2cam224_1e-4_rgb_depth_flow_streamemb_tok_priv/<date>
# Model code: src/fastwam/models/wan22/fastwam_joint_distill.py

defaults:
  - override /data: libero_2cam_rgb_depth_flow
  - override /model: fastwam_joint
  - _self_

data:
  train:
    rgb_condition_modalities: []   # teacher needs the real D0 / F0 (student only reads the RGB video)

batch_size: 16
num_workers: 8
gradient_accumulation_steps: 2

model:
  _target_: fastwam.runtime_distill.create_fastwam_joint_distill
  mot_checkpoint_mixed_attn: false
  teacher_run: ???
  teacher_step: 21700
  distill_action_target: gt
  distill_feature_weight: 1.0

EVALUATION:
  compile_action_infer: false

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 5000
weight_decay: 1e-2
resume: null
