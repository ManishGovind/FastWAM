# @package _global_
# RoboTwin CLEAN, MM + stream embedding added to the noisy FUTURE TOKENS (stream_embedding_mode: token).
# Same as robotwin_joint_3cam_384_1e-4_clean_rgb_depth_flow except the per-stream identity.
#   sequence = [R0 | R_fut | D_fut | F_fut | A]   (120 + 3*2*120 + 32 = 872 tokens)
#   video    : each future attends R0 + its own future (as MM)
#   action   : reads all futures (as MM); video never attends the action

defaults:
  - override /data: robotwin_clean_rgb_depth_flow
  - override /model: fastwam_joint_multimodal
  - _self_

batch_size: 8
num_workers: 8
gradient_accumulation_steps: 4   # global 8 x 4 x 8 GPUs = 256 (4 GPUs: accum 8)

model:
  mot_checkpoint_mixed_attn: false
  cross_stream_attention: none
  stream_embedding: true
  stream_embedding_mode: token   # added once to the patch-embedded future tokens (adaLN untouched)

EVALUATION:
  compile_action_infer: false
  action_attend_mode: all

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 10000
weight_decay: 1e-2
resume: null
