# @package _global_
# Router (REINFORCE) with the MM layout and a modality condition:
#   context  = T5("<instruction> Predict the <modality> video.") + proprio   (joint, as in the reference WAM paper)
#   sequence = [R0 | R_fut | D_fut | F_fut | A]; the action attends R0 + the chosen future only
#   video loss on the chosen future only; router warm-up 2000 steps.
# Needs: python scripts/precompute_modality_text_embeds.py task=libero_joint_2cam224_1e-4_router_new_full_prompt
# Router sees the same full R0 + MoT context as FastWAM training (no pool/mean).

defaults:
  - override /data: libero_2cam_rgb_depth_flow
  - override /model: fastwam_joint_multimodal_select_new
  - _self_

batch_size: 16
num_workers: 8
gradient_accumulation_steps: 2

model:
  mot_checkpoint_mixed_attn: false
  enabled_video_streams: [rgb, depth, flow]
  modality_select: router
  stream_router_temperature: 1.0
  router_entropy_coef: 0.01
  router_collapse_kl: 0.1
  router_warmup_steps: 2000
  router_layout: full
  router_video_loss: chosen
  modality_prompt: true
  modality_prompt_mode: joint
  router_reward: action
  router_baseline: timestep_ema
  router_adv_normalize: true
  # Same HxW as data.train.video_size (R0 flatten dim).
  router_video_size: ${data.train.video_size}

EVALUATION:
  compile_action_infer: false
  # When modality_select=router, infer uses router argmax (active_future).
  # Override with action_attend_mode for ablations without the router.
  action_attend_mode: all

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 10000
weight_decay: 1e-2
resume: null
