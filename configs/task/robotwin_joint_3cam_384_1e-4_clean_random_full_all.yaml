# @package _global_
# RoboTwin CLEAN, SR-MoT (random): full layout, video loss on ALL futures, the action reads ONE
# future chosen uniformly per sample. Same data / schedule as the clean RGB baseline.

defaults:
  - override /data: robotwin_clean_rgb_depth_flow
  - override /model: fastwam_joint_multimodal_select_new
  - _self_

batch_size: 8
num_workers: 8
gradient_accumulation_steps: 4   # global 8 x 4 x 8 GPUs = 256 (4 GPUs: accum 8)

model:
  mot_checkpoint_mixed_attn: false
  enabled_video_streams: [rgb, depth, flow]
  modality_select: random
  router_layout: full
  router_video_loss: all
  modality_prompt: false

EVALUATION:
  compile_action_infer: false
  active_future: random

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500
weight_decay: 1e-2
resume: null
