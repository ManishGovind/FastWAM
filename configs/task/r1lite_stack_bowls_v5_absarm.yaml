# @package _global_
defaults:
  - override /data: r1lite_stack_bowls_v5_absarm
  - override /model: fastwam_joint
  - _self_
batch_size: 16
num_workers: 8
output_dir: ./runs/r1lite_stack_bowls_v5_absarm
eval_num_inference_steps: 10
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
wandb:
  enabled: false
  workspace: null
  project: fast-wam
  name: r1lite_stack_bowls_v5_absarm
  group: null
  mode: online
model:
  mot_checkpoint_mixed_attn: false
  redirect_common_files: false
  action_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
lr_scheduler_type: cosine
learning_rate: 1e-4
num_epochs: 10
max_steps: 20000
log_every: 10
save_every: 5000
eval_every: 5000
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
